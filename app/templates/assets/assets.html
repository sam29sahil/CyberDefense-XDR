<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Management — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="assets" data-title="Asset Management">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i><span class="current">Asset Management</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Asset Management</h1>
          <p class="text-muted mt-1">1,266 assets discovered across 6 environments</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-secondary btn-sm"><i class="bi bi-arrow-repeat"></i> Rescan Inventory</button>
          <button class="btn btn-primary btn-sm" data-modal-open="addAssetModal"><i class="bi bi-plus-lg"></i> Add Asset</button>
        </div>
      </div>

      <!-- Summary stat row -->
      <div class="stat-grid-4 mb-4">
        <div class="card stat-card accent-primary"><div class="eyebrow">Total Assets</div><div class="stat-value">1,266</div></div>
        <div class="card stat-card accent-success"><div class="eyebrow">Online</div><div class="stat-value text-success">1,248</div></div>
        <div class="card stat-card accent-danger"><div class="eyebrow">Critical Risk</div><div class="stat-value text-danger">2</div></div>
        <div class="card stat-card accent-warning"><div class="eyebrow">Unassigned Owner</div><div class="stat-value text-warning">9</div></div>
      </div>

      <!-- Table -->
      <section class="xdr-table-wrap" aria-label="Assets table">
        <div class="table-toolbar">
          <div class="search-input-wrap">
            <i class="bi bi-search"></i>
            <input class="form-control search-input" id="assetSearch" placeholder="Search by name, IP, or owner…">
          </div>
          <select class="form-select filter-w-md" id="filterType">
            <option value="">All types</option>
            <option>Server</option><option>Database</option><option>Workstation</option>
            <option>Firewall</option><option>Router</option><option>Domain Controller</option>
            <option>Mail Gateway</option><option>Container Host</option><option>Load Balancer</option>
          </select>
          <select class="form-select filter-w-sm" id="filterSev">
            <option value="">All severities</option>
            <option value="critical">Critical</option><option value="high">High</option>
            <option value="medium">Medium</option><option value="low">Low</option>
          </select>
          <select class="form-select filter-w-sm" id="filterStatus">
            <option value="">All statuses</option>
            <option value="online">Online</option><option value="offline">Offline</option>
          </select>
          <button class="btn btn-ghost btn-sm ms-auto" id="clearFilters"><i class="bi bi-x-circle"></i> Clear</button>
        </div>

        <div class="bulk-action-bar" id="bulkBar">
          <span><strong id="bulkCount">0</strong> selected</span>
          <button class="btn btn-secondary btn-sm"><i class="bi bi-tag"></i> Tag</button>
          <button class="btn btn-secondary btn-sm"><i class="bi bi-search"></i> Scan Now</button>
          <button class="btn btn-outline-danger btn-sm ms-auto"><i class="bi bi-trash"></i> Remove</button>
        </div>

        <table class="xdr-table" id="assetsTable">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
        <div class="xdr-pagination" id="assetsPagination"></div>
      </section>
    </div>
  </div>
</div>

<!-- Add Asset Modal -->
<div class="xdr-modal-backdrop" data-modal-backdrop="addAssetModal"></div>
<div class="xdr-modal" id="addAssetModal">
  <div class="xdr-modal-header"><h3>Add asset</h3><button data-modal-close class="btn btn-icon btn-ghost"><i class="bi bi-x-lg"></i></button></div>
  <div class="xdr-modal-body">
    <div class="mb-3"><label class="form-label">Asset name</label><input class="form-control" placeholder="e.g. WEB-PROD-04"></div>
    <div class="mb-3"><label class="form-label">Type</label>
      <select class="form-select"><option>Server</option><option>Database</option><option>Workstation</option><option>Firewall</option></select>
    </div>
    <div class="mb-3"><label class="form-label">IP address</label><input class="form-control" placeholder="10.0.x.x"></div>
    <div><label class="form-label">Owner team</label><input class="form-control" placeholder="e.g. Platform Team"></div>
  </div>
  <div class="xdr-modal-footer">
    <button class="btn btn-secondary" data-modal-close>Cancel</button>
    <button class="btn btn-primary" data-modal-close>Add Asset</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/modal-helpers.js"></script>
<script src="../assets/js/core/datatable.js"></script>
<script src="../assets/js/data/assets-data.js"></script>
<script src="../assets/js/pages/assets.js"></script>
</body>
</html>
