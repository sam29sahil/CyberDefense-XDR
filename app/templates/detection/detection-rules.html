<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detection Rules — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="detection-engine" data-title="Detection Rules">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="detection-dashboard.html">Detection Engine</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Detection Rules</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Detection Rules</h1>
          <p class="text-muted mt-1" id="ruleCountSummary">— rules</p>
        </div>
        <div class="d-flex gap-2">
          <a href="create-rule.html" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Create Rule</a>
        </div>
      </div>

      <section class="xdr-table-wrap" aria-label="Detection rules table">
        <div class="table-toolbar">
          <div class="search-input-wrap">
            <i class="bi bi-search"></i>
            <input class="form-control search-input" id="ruleSearch" placeholder="Search rules by name, category, or MITRE ID…">
          </div>
          <select class="form-select filter-w-sm" id="filterSev">
            <option value="">All severities</option>
            <option value="critical">Critical</option><option value="high">High</option>
            <option value="medium">Medium</option><option value="low">Low</option>
          </select>
          <select class="form-select filter-w-md" id="filterStatus">
            <option value="">All statuses</option>
            <option value="active">Active</option><option value="testing">Testing</option><option value="disabled">Disabled</option>
          </select>
          <select class="form-select filter-w-md" id="filterCategory">
            <option value="">All categories</option>
          </select>
          <button class="btn btn-ghost btn-sm ms-auto" id="clearFilters"><i class="bi bi-x-circle"></i> Clear</button>
        </div>

        <table class="xdr-table" id="rulesTable">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
        <div class="xdr-pagination" id="rulesPagination"></div>
      </section>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="xdr-modal-backdrop" data-modal-backdrop="deleteRuleModal"></div>
<div class="xdr-modal" id="deleteRuleModal">
  <div class="xdr-modal-header"><h3>Delete detection rule</h3><button data-modal-close class="btn btn-icon btn-ghost"><i class="bi bi-x-lg"></i></button></div>
  <div class="xdr-modal-body">
    <p class="mb-0">Delete "<strong id="deleteRuleName">—</strong>"? This stops all future detections from this rule and can't be undone.</p>
  </div>
  <div class="xdr-modal-footer">
    <button class="btn btn-secondary" data-modal-close>Cancel</button>
    <button class="btn btn-danger" id="confirmDeleteRuleBtn" data-modal-close>Delete Rule</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/modal-helpers.js"></script>
<script src="../assets/js/core/datatable.js"></script>
<script src="../assets/js/data/detection-rules-data.js"></script>
<script src="../assets/js/pages/detection-rules.js"></script>
</body>
</html>
