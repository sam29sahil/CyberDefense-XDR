<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detection History — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="detection-engine" data-title="Detection History">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="detection-dashboard.html">Detection Engine</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Detection History</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Detection History</h1>
          <p class="text-muted mt-1" id="historyCountSummary">— events</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-secondary btn-sm" id="exportBtn"><i class="bi bi-download"></i> Export</button>
        </div>
      </div>

      <div class="stat-grid-4 mb-4">
        <div class="card stat-card accent-danger"><div class="eyebrow">Critical / High</div><div class="stat-value" id="statCritHigh">—</div></div>
        <div class="card stat-card accent-primary"><div class="eyebrow">New</div><div class="stat-value" id="statNew">—</div></div>
        <div class="card stat-card accent-warning"><div class="eyebrow">Investigating</div><div class="stat-value" id="statInvestigating">—</div></div>
        <div class="card stat-card accent-success"><div class="eyebrow">Resolved</div><div class="stat-value" id="statResolved">—</div></div>
      </div>

      <section class="xdr-table-wrap" aria-label="Detection history table">
        <div class="table-toolbar">
          <div class="search-input-wrap">
            <i class="bi bi-search"></i>
            <input class="form-control search-input" id="historySearch" placeholder="Search by rule, host, or source…">
          </div>
          <select class="form-select filter-w-sm" id="filterSev">
            <option value="">All severities</option>
            <option value="critical">Critical</option><option value="high">High</option>
            <option value="medium">Medium</option><option value="low">Low</option>
          </select>
          <select class="form-select filter-w-md" id="filterStatus">
            <option value="">All statuses</option>
            <option value="new">New</option><option value="investigating">Investigating</option>
            <option value="resolved">Resolved</option><option value="false_positive">False Positive</option>
          </select>
          <select class="form-select filter-w-md" id="filterSource">
            <option value="">All sources</option>
          </select>
          <button class="btn btn-ghost btn-sm ms-auto" id="clearFilters"><i class="bi bi-x-circle"></i> Clear</button>
        </div>

        <table class="xdr-table" id="historyTable">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
        <div class="xdr-pagination" id="historyPagination"></div>
      </section>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/datatable.js"></script>
<script src="../assets/js/data/detection-history-data.js"></script>
<script src="../assets/js/pages/detection-history.js"></script>
</body>
</html>
