<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IOC Feed — CyberDefense XDR</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet"
    >

    <link
        href="{{ url_for('static', filename='css/main.css') }}"
        rel="stylesheet"
    >
</head>

<body data-page="threat-intel" data-title="IOC Feed">

<div class="app-shell">

    <div id="sidebar-root"></div>

    <div class="main-content">

        <div id="navbar-root"></div>

        <div class="page-wrap fade-in">

            <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
                <a href="{{ url_for('dashboard.index') }}">Home</a>
                <i class="bi bi-chevron-right sep"></i>

                <a href="{{ url_for('threatintel.dashboard_page') }}">
                    Threat Intelligence
                </a>

                <i class="bi bi-chevron-right sep"></i>

                <span class="current">IOC Feed</span>
            </nav>


            <div class="section-title-row">

                <div>
                    <h1>IOC Feed</h1>

                    <p
                        class="text-muted mt-1"
                        id="iocCountSummary"
                    >
                        Loading indicators…
                    </p>
                </div>

                <div class="d-flex gap-2">

                    <a
                        href="{{ url_for('threatintel.feeds_page') }}"
                        class="btn btn-secondary btn-sm"
                    >
                        <i class="bi bi-broadcast-pin"></i>
                        Manage Feeds
                    </a>

                </div>

            </div>


            <section
                class="xdr-table-wrap"
                aria-label="IOC feed table"
            >

                <div class="table-toolbar">

                    <div class="search-input-wrap">

                        <i class="bi bi-search"></i>

                        <input
                            class="form-control search-input"
                            id="iocSearch"
                            type="search"
                            placeholder="Search indicator, source, or tag…"
                            autocomplete="off"
                        >

                    </div>


                    <select
                        class="form-select filter-w-sm"
                        id="filterType"
                    >
                        <option value="">All types</option>
                        <option value="ip">IP</option>
                        <option value="domain">Domain</option>
                        <option value="hash">Hash</option>
                        <option value="url">URL</option>
                    </select>


                    <select
                        class="form-select filter-w-sm"
                        id="filterLevel"
                    >
                        <option value="">All threat levels</option>
                        <option value="critical">Critical</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>


                    <select
                        class="form-select filter-w-md"
                        id="filterStatus"
                    >
                        <option value="">All statuses</option>
                        <option value="active">Active</option>
                        <option value="blocked">Blocked</option>
                        <option value="whitelisted">Whitelisted</option>
                        <option value="expired">Expired</option>
                    </select>


                    <button
                        class="btn btn-ghost btn-sm ms-auto"
                        id="clearFilters"
                        type="button"
                    >
                        <i class="bi bi-x-circle"></i>
                        Clear
                    </button>

                </div>


                <div class="table-responsive">

                    <table
                        class="xdr-table"
                        id="iocTable"
                    >

                        <thead>
                            <tr></tr>
                        </thead>

                        <tbody></tbody>

                    </table>

                </div>


                <div
                    class="xdr-pagination"
                    id="iocPagination"
                ></div>

            </section>

        </div>

    </div>

</div>


<script>
    window.THREAT_INTEL_API = "{{ url_for('threatintel.index') }}";
    window.THREAT_INTEL_IOC_DETAILS =
        "{{ url_for('threatintel.ioc_details_page') }}";
</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script
    src="{{ url_for('static', filename='js/app.js') }}">
</script>

<script
    src="{{ url_for('static', filename='js/core/shell.js') }}">
</script>

<script
    src="{{ url_for('static', filename='js/core/toast.js') }}">
</script>

<script
    src="{{ url_for('static', filename='js/core/datatable.js') }}">
</script>

<script
    src="{{ url_for('static', filename='js/pages/ioc-feed.js') }}">
</script>

</body>
</html>
