<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed Sources — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="threat-intel" data-title="Feed Sources">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="threat-dashboard.html">Threat Intelligence</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Feed Sources</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Feed Sources</h1>
          <p class="text-muted mt-1" id="feedCountSummary">— feeds</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary btn-sm" data-modal-open="addFeedModal"><i class="bi bi-plus-lg"></i> Add Feed</button>
        </div>
      </div>

      <div class="xdr-table-wrap">
        <table class="xdr-table">
          <thead><tr><th>Feed</th><th>Provider</th><th>Type</th><th>Status</th><th>IOC Count</th><th>Last Sync</th><th>Reliability</th><th></th></tr></thead>
          <tbody id="feedsBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add Feed Modal -->
<div class="xdr-modal-backdrop" data-modal-backdrop="addFeedModal"></div>
<div class="xdr-modal" id="addFeedModal">
  <div class="xdr-modal-header"><h3>Add feed source</h3><button data-modal-close class="btn btn-icon btn-ghost"><i class="bi bi-x-lg"></i></button></div>
  <div class="xdr-modal-body">
    <div class="mb-3"><label class="form-label">Feed name</label><input class="form-control" id="newFeedName" placeholder="e.g. Custom STIX/TAXII feed"></div>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Provider</label><input class="form-control" id="newFeedProvider" placeholder="e.g. Internal SOC"></div>
      <div class="col-md-6">
        <label class="form-label">Type</label>
        <select class="form-select" id="newFeedType">
          <option>Open Source</option><option>Commercial</option><option>Industry Sharing</option><option>Internal</option>
        </select>
      </div>
    </div>
  </div>
  <div class="xdr-modal-footer">
    <button class="btn btn-secondary" data-modal-close>Cancel</button>
    <button class="btn btn-primary" id="addFeedConfirm" data-modal-close>Add Feed</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/modal-helpers.js"></script>
<script src="../assets/js/data/threat-data.js"></script>
<script src="../assets/js/pages/feeds.js"></script>
</body>
</html>
