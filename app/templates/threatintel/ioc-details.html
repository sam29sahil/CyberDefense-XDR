<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IOC Details — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="threat-intel" data-title="IOC Details">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="threat-dashboard.html">Threat Intelligence</a><i class="bi bi-chevron-right sep"></i>
        <a href="ioc-feed.html">IOC Feed</a><i class="bi bi-chevron-right sep"></i>
        <span class="current" id="breadcrumbIocId">IOC Details</span>
      </nav>

      <div class="card mb-4">
        <div class="card-body d-flex flex-wrap justify-content-between align-items-start gap-3">
          <div class="d-flex gap-3">
            <div class="brand-mark brand-mark-lg"><i class="bi bi-radar" id="iocIcon"></i></div>
            <div>
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <h1 class="fs-detail-title ioc-value" id="iocValue">—</h1>
                <span id="iocLevelBadge"></span>
                <span class="ioc-type-chip" id="iocTypeChip">—</span>
              </div>
              <p class="text-muted mb-2">Source: <span id="iocSource">—</span> · Confidence: <span id="iocConfidence">—</span></p>
              <div class="d-flex gap-2 flex-wrap" id="iocTags"></div>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-danger btn-sm" id="blockBtn"><i class="bi bi-slash-circle"></i> Block Indicator</button>
            <button class="btn btn-secondary btn-sm" id="watchlistBtn"><i class="bi bi-eye"></i> Add to Watchlist</button>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-lg-3 col-6"><div class="card stat-card accent-primary"><div class="eyebrow">Sightings</div><div class="stat-value" id="statSightings">—</div></div></div>
        <div class="col-lg-3 col-6"><div class="card stat-card accent-info"><div class="eyebrow">First Seen</div><div class="stat-value fs-inherit-lg" id="statFirstSeen">—</div></div></div>
        <div class="col-lg-3 col-6"><div class="card stat-card accent-warning"><div class="eyebrow">Last Seen</div><div class="stat-value fs-inherit-lg" id="statLastSeen">—</div></div></div>
        <div class="col-lg-3 col-6"><div class="card stat-card accent-danger"><div class="eyebrow">Status</div><div class="stat-value fs-inherit-lg" id="statStatus">—</div></div></div>
      </div>

      <div class="row g-4">
        <div class="col-lg-6">
          <section class="card h-100" aria-labelledby="attributionTitle">
            <div class="card-header"><h2 id="attributionTitle">Attribution</h2></div>
            <div class="card-body">
              <div class="info-row"><span class="text-muted">Associated campaign</span><span id="attrCampaign">—</span></div>
              <div class="info-row"><span class="text-muted">Threat actor</span><span id="attrActor">—</span></div>
              <div class="info-row"><span class="text-muted">Feed source</span><span id="attrSource">—</span></div>
              <div class="info-row"><span class="text-muted">Indicator type</span><span id="attrType">—</span></div>
            </div>
          </section>
        </div>
        <div class="col-lg-6">
          <section class="card h-100" aria-labelledby="relatedIocTitle">
            <div class="card-header"><h2 id="relatedIocTitle">Related Indicators — same campaign</h2></div>
            <div class="card-body" id="relatedIocsList"></div>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/data/threat-data.js"></script>
<script src="../assets/js/data/actors-data.js"></script>
<script src="../assets/js/pages/ioc-details.js"></script>
</body>
</html>
