<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threat Actors — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="threat-intel" data-title="Threat Actors">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="threat-dashboard.html">Threat Intelligence</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Threat Actors</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Threat Actors</h1>
          <p class="text-muted mt-1" id="actorSummary">— actors tracked</p>
        </div>
        <div class="search-input-wrap" style="max-width:280px;">
          <i class="bi bi-search"></i>
          <input class="form-control search-input" id="actorSearch" placeholder="Search actors…">
        </div>
      </div>

      <div class="row g-3" id="actorGrid"></div>
    </div>
  </div>
</div>

<!-- Actor detail modal -->
<div class="xdr-modal-backdrop" data-modal-backdrop="actorModal"></div>
<div class="xdr-modal" id="actorModal" style="max-width:600px;">
  <div class="xdr-modal-header"><h3 id="acModalName">Actor</h3><button data-modal-close class="btn btn-icon btn-ghost"><i class="bi bi-x-lg"></i></button></div>
  <div class="xdr-modal-body">
    <p class="text-muted" id="acModalDesc">—</p>
    <div class="info-row"><span class="text-muted">Origin</span><span id="acModalOrigin">—</span></div>
    <div class="info-row"><span class="text-muted">Motivation</span><span id="acModalMotivation">—</span></div>
    <div class="info-row"><span class="text-muted">Sophistication</span><span id="acModalSoph">—</span></div>
    <div class="info-row"><span class="text-muted">First seen</span><span id="acModalFirst">—</span></div>
    <div class="info-row"><span class="text-muted">Last activity</span><span id="acModalLast">—</span></div>
    <div class="mt-3"><div class="text-xs text-muted mb-1">TARGET SECTORS</div><div id="acModalSectors" class="d-flex flex-wrap gap-2 mb-3"></div></div>
    <div><div class="text-xs text-muted mb-1">MITRE TACTICS OBSERVED</div><div id="acModalTactics" class="d-flex flex-wrap gap-2"></div></div>
  </div>
  <div class="xdr-modal-footer">
    <button class="btn btn-secondary" data-modal-close>Close</button>
    <a href="campaigns.html" class="btn btn-primary">View Campaigns</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/modal-helpers.js"></script>
<script src="../assets/js/data/actors-data.js"></script>
<script src="../assets/js/pages/actors.js"></script>
</body>
</html>
