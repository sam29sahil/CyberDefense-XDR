<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threat Intelligence — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="threat-intel" data-title="Threat Intelligence">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <main class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i><span class="current">Threat Intelligence</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Threat Intelligence</h1>
          <p class="text-muted mt-1">70 tracked indicators · 8 active campaigns · 7 feed sources</p>
        </div>
        <div class="d-flex gap-2">
          <a href="actors.html" class="btn btn-secondary btn-sm"><i class="bi bi-person-badge"></i> Threat Actors</a>
          <a href="campaigns.html" class="btn btn-secondary btn-sm"><i class="bi bi-flag"></i> Campaigns</a>
          <a href="ioc-feed.html" class="btn btn-primary btn-sm"><i class="bi bi-broadcast"></i> IOC Feed</a>
        </div>
      </div>

      <div class="row g-3 mb-4" id="kpiRow"></div>

      <div class="row g-4 mb-4">
        <div class="col-lg-7">
          <section class="card h-100" aria-labelledby="iocTrendTitle">
            <div class="card-header"><h2 id="iocTrendTitle">New IOCs — last 14 days</h2></div>
            <div class="card-body"><div class="chart-box"><canvas id="iocTrendChart"></canvas></div></div>
          </section>
        </div>
        <div class="col-lg-5">
          <section class="card h-100" aria-labelledby="iocTypeTitle">
            <div class="card-header"><h2 id="iocTypeTitle">IOC Type Distribution</h2></div>
            <div class="card-body"><div class="chart-box-sm"><canvas id="iocTypeChart"></canvas></div></div>
          </section>
        </div>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-lg-7">
          <section class="card h-100" aria-labelledby="latestIocTitle">
            <div class="card-header">
              <h2 id="latestIocTitle">Latest Indicators</h2>
              <a href="ioc-feed.html" class="text-sm">View all <i class="bi bi-arrow-right"></i></a>
            </div>
            <div class="xdr-table-wrap flush">
              <table class="xdr-table">
                <thead><tr><th>Indicator</th><th>Type</th><th>Threat Level</th><th>Last Seen</th></tr></thead>
                <tbody id="latestIocsBody"></tbody>
              </table>
            </div>
          </section>
        </div>
        <div class="col-lg-5">
          <section class="card h-100" aria-labelledby="topActorsTitle">
            <div class="card-header"><h2 id="topActorsTitle">Most Active Actors</h2></div>
            <div class="card-body" id="topActorsList"></div>
          </section>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-12">
          <section class="card" aria-labelledby="activeCampaignsTitle">
            <div class="card-header"><h2 id="activeCampaignsTitle">Active Campaigns</h2><a href="campaigns.html" class="text-sm">View all <i class="bi bi-arrow-right"></i></a></div>
            <div class="card-body"><div class="row g-3" id="activeCampaignsGrid"></div></div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/data/threat-data.js"></script>
<script src="../assets/js/data/actors-data.js"></script>
<script src="../assets/js/pages/threat-dashboard.js"></script>
</body>
</html>
