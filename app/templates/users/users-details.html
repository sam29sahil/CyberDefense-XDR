<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Details — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="user-management" data-title="User Details">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="users.html">Users</a><i class="bi bi-chevron-right sep"></i>
        <span class="current" id="breadcrumbUserName">User Details</span>
      </nav>

      <div class="card mb-4">
        <div class="card-body d-flex flex-wrap justify-content-between align-items-start gap-3">
          <div class="d-flex gap-3">
            <span class="user-avatar user-avatar-lg" id="userAvatar">—</span>
            <div>
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <h1 class="fs-detail-title" id="userName">—</h1>
                <span id="userStatusPill"></span>
              </div>
              <p class="text-muted mb-2" id="userEmail">—</p>
              <div class="d-flex gap-2 flex-wrap">
                <span class="badge badge-neutral" id="userRoleBadge">—</span>
                <span class="badge badge-neutral" id="userDeptBadge">—</span>
                <span class="mfa-badge" id="userMfaBadge"></span>
              </div>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-secondary btn-sm" id="resetPwBtn"><i class="bi bi-key"></i> Reset Password</button>
            <button class="btn btn-secondary btn-sm" id="toggleStatusBtn"><i class="bi bi-power"></i> Deactivate</button>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-lg-3 col-6"><div class="card stat-card accent-primary"><div class="eyebrow">Active Sessions</div><div class="stat-value" id="statSessions">—</div></div></div>
        <div class="col-lg-3 col-6"><div class="card stat-card accent-info"><div class="eyebrow">Last Login</div><div class="stat-value fs-inherit-lg" id="statLastLogin">—</div></div></div>
        <div class="col-lg-3 col-6"><div class="card stat-card accent-success"><div class="eyebrow">Account Created</div><div class="stat-value fs-inherit-lg" id="statCreated">—</div></div></div>
        <div class="col-lg-3 col-6"><div class="card stat-card accent-warning"><div class="eyebrow">Permissions Granted</div><div class="stat-value" id="statPerms">—</div></div></div>
      </div>

      <div class="row g-4">
        <div class="col-lg-5">
          <section class="card h-100" aria-labelledby="roleInfoTitle">
            <div class="card-header"><h2 id="roleInfoTitle">Role &amp; Access</h2></div>
            <div class="card-body">
              <p class="text-muted text-sm" id="roleDescription">—</p>
              <a href="permissions.html" class="btn btn-ghost btn-sm"><i class="bi bi-arrow-right"></i> View full permission matrix</a>
            </div>
          </section>
        </div>
        <div class="col-lg-7">
          <section class="card h-100" aria-labelledby="recentActivityTitle">
            <div class="card-header">
              <h2 id="recentActivityTitle">Recent Activity</h2>
              <a href="activity.html" class="text-sm">View all <i class="bi bi-arrow-right"></i></a>
            </div>
            <div class="xdr-table-wrap flush">
              <table class="xdr-table">
                <thead><tr><th>Time</th><th>Action</th><th>Resource</th><th>Result</th></tr></thead>
                <tbody id="userActivityBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/data/users-data.js"></script>
<script src="../assets/js/pages/user-details.js"></script>
</body>
</html>
