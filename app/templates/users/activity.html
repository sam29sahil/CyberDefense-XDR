<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Log — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="user-management" data-title="Activity Log">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="users.html">Users</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Activity Log</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Activity Log</h1>
          <p class="text-muted mt-1" id="activitySummary">— events</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-secondary btn-sm" id="exportBtn"><i class="bi bi-download"></i> Export</button>
        </div>
      </div>

      <section class="xdr-table-wrap" aria-label="Activity table">
        <div class="table-toolbar">
          <div class="search-input-wrap">
            <i class="bi bi-search"></i>
            <input class="form-control search-input" id="activitySearch" placeholder="Search by user, action, or resource…">
          </div>
          <select class="form-select filter-w-md" id="filterAction">
            <option value="">All actions</option>
            <option value="login">Login</option><option value="logout">Logout</option>
            <option value="view">View</option>
            <option value="create">Create</option><option value="update">Update</option>
            <option value="delete">Delete</option><option value="export">Export</option>
            <option value="permission_change">Permission change</option>
          </select>
          <select class="form-select filter-w-sm" id="filterResult">
            <option value="">All results</option>
            <option value="success">Success</option><option value="failed">Failed</option>
          </select>
          <button class="btn btn-ghost btn-sm ms-auto" id="clearFilters"><i class="bi bi-x-circle"></i> Clear</button>
        </div>

        <table class="xdr-table" id="activityTable">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
        <div class="xdr-pagination" id="activityPagination"></div>
      </section>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/datatable.js"></script>
<script src="../assets/js/data/users-data.js"></script>
<script src="../assets/js/pages/activity.js"></script>
</body>
</html>
