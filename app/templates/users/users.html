<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="user-management" data-title="Users">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i><span class="current">Users</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>User Management</h1>
          <p class="text-muted mt-1" id="userCountSummary">— users</p>
        </div>
        <div class="d-flex gap-2">
          <a href="roles.html" class="btn btn-secondary btn-sm"><i class="bi bi-diagram-2"></i> Roles</a>
          <a href="permissions.html" class="btn btn-secondary btn-sm"><i class="bi bi-shield-lock"></i> Permissions</a>
          <a href="activity.html" class="btn btn-secondary btn-sm"><i class="bi bi-clock-history"></i> Activity</a>
          <button class="btn btn-primary btn-sm" data-modal-open="addUserModal"><i class="bi bi-person-plus"></i> Add User</button>
        </div>
      </div>

      <section class="xdr-table-wrap" aria-label="Users table">
        <div class="table-toolbar">
          <div class="search-input-wrap">
            <i class="bi bi-search"></i>
            <input class="form-control search-input" id="userSearch" placeholder="Search by name, email, or department…">
          </div>
          <select class="form-select filter-w-md" id="filterRole"><option value="">All roles</option></select>
          <select class="form-select filter-w-md" id="filterStatus">
            <option value="">All statuses</option>
            <option value="active">Active</option><option value="inactive">Inactive</option><option value="locked">Locked</option>
          </select>
          <button class="btn btn-ghost btn-sm ms-auto" id="clearFilters"><i class="bi bi-x-circle"></i> Clear</button>
        </div>

        <table class="xdr-table" id="usersTable">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
        <div class="xdr-pagination" id="usersPagination"></div>
      </section>
    </div>
  </div>
</div>

<!-- Add User Modal -->
<div class="xdr-modal-backdrop" data-modal-backdrop="addUserModal"></div>
<div class="xdr-modal" id="addUserModal">
  <div class="xdr-modal-header"><h3>Add user</h3><button data-modal-close class="btn btn-icon btn-ghost"><i class="bi bi-x-lg"></i></button></div>
  <div class="xdr-modal-body">
    <div class="row g-3 mb-3">
      <div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" id="newUserName" placeholder="e.g. Jordan Blake"></div>
      <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" id="newUserEmail" placeholder="jordan.blake@cyberdefensexdr.io"></div>
    </div>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Role</label><select class="form-select" id="newUserRole"></select></div>
      <div class="col-md-6"><label class="form-label">Department</label>
        <select class="form-select" id="newUserDept">
          <option>SOC Operations</option><option>Threat Intelligence</option><option>Incident Response</option>
          <option>Vulnerability Management</option><option>IT Security</option><option>Compliance</option><option>Engineering</option>
        </select>
      </div>
    </div>
  </div>
  <div class="xdr-modal-footer">
    <button class="btn btn-secondary" data-modal-close>Cancel</button>
    <button class="btn btn-primary" id="addUserConfirm" data-modal-close>Add User</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/modal-helpers.js"></script>
<script src="../assets/js/core/datatable.js"></script>
<script src="../assets/js/data/users-data.js"></script>
<script src="../assets/js/pages/users.js"></script>
</body>
</html>
