<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permissions — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="user-management" data-title="Permissions">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="users.html">Users</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Permissions</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Permission Matrix</h1>
          <p class="text-muted mt-1">Toggle capabilities per role — changes apply immediately to all users with that role</p>
        </div>
        <div class="d-flex gap-2">
          <a href="roles.html" class="btn btn-secondary btn-sm"><i class="bi bi-diagram-2"></i> Manage Roles</a>
          <button class="btn btn-primary btn-sm" id="saveChangesBtn"><i class="bi bi-check-lg"></i> Save Changes</button>
        </div>
      </div>

      <section class="card">
        <div class="card-body perm-matrix-wrap">
          <table class="perm-matrix" id="permMatrixTable">
            <thead><tr id="permMatrixHead"></tr></thead>
            <tbody id="permMatrixBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/data/users-data.js"></script>
<script src="../assets/js/pages/permissions.js"></script>
</body>
</html>
