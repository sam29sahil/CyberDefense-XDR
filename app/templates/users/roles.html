<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roles — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="user-management" data-title="Roles">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="users.html">Users</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Roles</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Roles</h1>
          <p class="text-muted mt-1" id="roleSummary">— roles configured</p>
        </div>
        <div class="d-flex gap-2">
          <a href="permissions.html" class="btn btn-secondary btn-sm"><i class="bi bi-shield-lock"></i> Permission Matrix</a>
          <button class="btn btn-primary btn-sm" data-modal-open="addRoleModal"><i class="bi bi-plus-lg"></i> New Role</button>
        </div>
      </div>

      <div class="row g-3" id="roleGrid"></div>
    </div>
  </div>
</div>

<!-- Add Role Modal -->
<div class="xdr-modal-backdrop" data-modal-backdrop="addRoleModal"></div>
<div class="xdr-modal" id="addRoleModal">
  <div class="xdr-modal-header"><h3>New role</h3><button data-modal-close class="btn btn-icon btn-ghost"><i class="bi bi-x-lg"></i></button></div>
  <div class="xdr-modal-body">
    <div class="mb-3"><label class="form-label">Role name</label><input class="form-control" id="newRoleName" placeholder="e.g. Junior Analyst"></div>
    <div class="mb-0"><label class="form-label">Description</label><textarea class="form-control" id="newRoleDesc" rows="2" placeholder="What can this role do?"></textarea></div>
  </div>
  <div class="xdr-modal-footer">
    <button class="btn btn-secondary" data-modal-close>Cancel</button>
    <button class="btn btn-primary" id="addRoleConfirm" data-modal-close>Create Role</button>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="xdr-modal-backdrop" data-modal-backdrop="deleteRoleModal"></div>
<div class="xdr-modal" id="deleteRoleModal">
  <div class="xdr-modal-header"><h3>Delete role</h3><button data-modal-close class="btn btn-icon btn-ghost"><i class="bi bi-x-lg"></i></button></div>
  <div class="xdr-modal-body"><p class="mb-0">Delete "<strong id="deleteRoleName">—</strong>"? Users assigned to this role will need to be reassigned.</p></div>
  <div class="xdr-modal-footer">
    <button class="btn btn-secondary" data-modal-close>Cancel</button>
    <button class="btn btn-danger" id="confirmDeleteRoleBtn" data-modal-close>Delete</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/modal-helpers.js"></script>
<script src="../assets/js/data/users-data.js"></script>
<script src="../assets/js/pages/roles.js"></script>
</body>
</html>
