<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Access — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body class="auth-shell centered">

<div class="auth-card wide fade-in">
  <div class="brand-row-mobile">
    <div class="brand-mark brand-mark-sm"><i class="bi bi-shield-lock-fill"></i></div>
    <span class="brand-text-inline">CyberDefense <span class="text-info">XDR</span></span>
  </div>

  <div class="step-dots"><span class="done"></span><span></span><span></span></div>

  <h1>Request platform access</h1>
  <p class="text-muted mb-4">Tell us about your organization — a security lead will provision your workspace within one business day.</p>

  <form id="registerForm" novalidate>
    <div class="row g-3">
      <div class="col-6">
        <label class="form-label" for="regFirst">First name</label>
        <input id="regFirst" class="form-control" placeholder="Aria" required>
      </div>
      <div class="col-6">
        <label class="form-label" for="regLast">Last name</label>
        <input id="regLast" class="form-control" placeholder="Reyes" required>
      </div>
      <div class="col-12">
        <label class="form-label" for="regEmail">Work email</label>
        <input id="regEmail" type="email" class="form-control" placeholder="you@company.com" required>
      </div>
      <div class="col-12">
        <label class="form-label" for="regCompany">Company</label>
        <input id="regCompany" class="form-control" placeholder="Acme Corp" required>
      </div>
      <div class="col-12">
        <label class="form-label" for="regTeamSize">Team size</label>
        <select id="regTeamSize" class="form-select">
          <option>1–10 analysts</option>
          <option>11–50 analysts</option>
          <option>51–200 analysts</option>
          <option>200+ analysts</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label" for="regPassword">Password</label>
        <input id="regPassword" type="password" class="form-control" placeholder="Minimum 12 characters" required>
        <div class="form-hint">Use a mix of upper/lowercase, numbers, and symbols.</div>
      </div>
    </div>

    <div class="form-check mt-3">
      <input class="form-check-input" type="checkbox" id="terms" required>
      <label class="form-check-label text-sm text-muted" for="terms">I agree to the Terms of Service and Security Policy.</label>
    </div>

    <button type="submit" class="btn btn-primary w-100 btn-lg mt-4">Request Access</button>
  </form>

  <p class="text-center text-sm text-muted mt-4">Already have an account? <a href="login.html">Sign in</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/pages/register.js"></script>
</body>
</html>
