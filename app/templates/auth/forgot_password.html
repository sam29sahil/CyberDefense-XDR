<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body class="auth-shell centered">

<div class="auth-card centered-text fade-in" id="authCard">
  <div class="auth-icon-circle"><i class="bi bi-key"></i></div>
  <h1>Reset your password</h1>
  <p class="text-muted mb-4">Enter your work email and we'll send a secure reset link.</p>

  <form id="resetForm" novalidate class="text-start">
    <label class="form-label" for="resetEmail">Work email</label>
    <input id="resetEmail" type="email" class="form-control" placeholder="you@company.com" required>
    <button type="submit" class="btn btn-primary w-100 btn-lg mt-4">Send Reset Link</button>
  </form>

  <a href="login.html" class="d-inline-flex align-items-center gap-1 mt-4 text-sm"><i class="bi bi-arrow-left"></i> Back to sign in</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/pages/forgot-password.js"></script>
</body>
</html>
