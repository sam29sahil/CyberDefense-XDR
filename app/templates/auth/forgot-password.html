<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password — CyberDefense XDR</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/main.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/pages/auth.css') }}"
    >

</head>


<body class="auth-shell centered">

<div
    class="auth-card centered-text fade-in"
    id="authCard"
>

    <div class="auth-icon-circle">
        <i class="bi bi-key"></i>
    </div>

    <h1>
        Forgot your password?
    </h1>

    <p class="text-muted mb-4">
        Enter your work email and we'll generate
        a secure password reset link.
    </p>


    <div
        id="messageBox"
        class="alert d-none text-start"
        role="alert"
    ></div>


    <form
        id="resetForm"
        novalidate
        class="text-start"
    >

        <label
            class="form-label"
            for="resetEmail"
        >
            Work email
        </label>

        <input
            id="resetEmail"
            type="email"
            class="form-control"
            placeholder="you@company.com"
            autocomplete="email"
            required
        >

        <button
            type="submit"
            id="resetButton"
            class="btn btn-primary w-100 btn-lg mt-4"
        >

            <span id="resetButtonText">
                Send Reset Link
            </span>

            <span
                id="resetButtonLoading"
                class="d-none"
            >

                <span
                    class="spinner-border spinner-border-sm me-2"
                    role="status"
                    aria-hidden="true"
                ></span>

                Generating...

            </span>

        </button>

    </form>


    <div
        id="resetLinkBox"
        class="alert alert-success text-start mt-4 d-none"
    >

        <strong>
            Password reset link generated
        </strong>

        <p class="small mt-2 mb-2">
            Development mode: open the link below
            to reset your password.
        </p>

        <a
            id="resetLink"
            href="#"
            class="text-break"
        ></a>

    </div>


    <a
        href="{{ url_for('auth.login') }}"
        class="d-inline-flex align-items-center gap-1 mt-4 text-sm"
    >

        <i class="bi bi-arrow-left"></i>

        Back to sign in

    </a>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script
    src="{{ url_for('static', filename='js/app.js') }}">
</script>

<script
    src="{{ url_for('static', filename='js/core/toast.js') }}">
</script>

<script
    src="{{ url_for('static', filename='js/pages/forgot-password.js') }}">
</script>

</body>

</html>
