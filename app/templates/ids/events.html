<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network IDS Events Explorer — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
</head>
<body data-page="network-ids" data-title="Network IDS Events">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <main class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="{{ url_for('dashboard.index') }}">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="{{ url_for('ids.dashboard') }}">Network IDS</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Events Explorer</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Network IDS Events Explorer</h1>
          <p class="text-muted mt-1">Investigate Suricata security alerts, network flows, and protocol metadata</p>
        </div>
        <div class="d-flex gap-2">
          <a href="{{ url_for('ids.dashboard') }}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Dashboard</a>
          <button class="btn btn-secondary btn-sm" id="btnRefreshEvents"><i class="bi bi-arrow-clockwise me-1"></i> Refresh</button>
        </div>
      </div>

      <!-- Filters Strip -->
      <div class="card mb-4">
        <div class="card-body">
          <div class="row g-2 align-items-center">
            <div class="col-lg-3 col-md-6">
              <div class="input-group input-group-sm">
                <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="searchQuery" placeholder="Search signature, IP, or category...">
              </div>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-6">
              <select class="form-select form-select-sm" id="filterEventType">
                <option value="">All Event Types</option>
                <option value="security_alert">Security Alerts</option>
                <option value="diagnostic">Diagnostics (Checksums)</option>
                <option value="alert">All Alerts (Raw)</option>
                <option value="flow">Flows</option>
                <option value="dns">DNS Queries</option>
                <option value="http">HTTP Traffic</option>
                <option value="tls">TLS Handshakes</option>
                <option value="ssh">SSH Sessions</option>
                <option value="fileinfo">File Transfers</option>
                <option value="stats">Sensor Stats</option>
              </select>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-6">
              <select class="form-select form-select-sm" id="filterSeverity">
                <option value="">All Severities</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
                <option value="info">Info</option>
              </select>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-6">
              <select class="form-select form-select-sm" id="filterProtocol">
                <option value="">All Protocols</option>
                <option value="TCP">TCP</option>
                <option value="UDP">UDP</option>
                <option value="ICMP">ICMP</option>
              </select>
            </div>
            <div class="col-lg-3 col-md-6 d-flex align-items-center justify-content-end gap-2">
              <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" id="checkAlertsOnly">
                <label class="form-check-label text-sm" for="checkAlertsOnly">Alerts only</label>
              </div>
              <button class="btn btn-secondary btn-sm" id="btnResetFilters">Reset</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Events Data Table -->
      <section class="xdr-table-wrap" aria-label="IDS Events">
        <table class="xdr-table" id="eventsTable">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Type</th>
              <th>Severity</th>
              <th>Source</th>
              <th>Destination</th>
              <th>Protocol</th>
              <th>Signature / Details</th>
              <th>Category</th>
              <th>Action</th>
              <th class="text-end">Action</th>
            </tr>
          </thead>
          <tbody id="eventsTableBody">
            <tr><td colspan="10" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm me-2"></span>Loading network events...</td></tr>
          </tbody>
        </table>

        <div class="d-flex justify-content-between align-items-center p-3 border-top" id="paginationWrap">
          <div class="text-xs text-muted" id="paginationInfo">Showing 0 of 0 events</div>
          <div class="d-flex gap-2" id="paginationControls">
            <button class="btn btn-secondary btn-sm" id="btnPrevPage" disabled><i class="bi bi-chevron-left"></i> Previous</button>
            <button class="btn btn-secondary btn-sm" id="btnNextPage" disabled>Next <i class="bi bi-chevron-right"></i></button>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
  window.XDR_ACTIVE = "network-ids";
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/shell.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/toast.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/network-ids-events.js') }}"></script>
</body>
</html>
