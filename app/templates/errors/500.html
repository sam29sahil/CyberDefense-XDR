<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Internal Error | CyberDefense XDR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .error-card { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 12px; padding: 2.5rem; text-align: center; max-width: 500px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); backdrop-filter: blur(8px); }

    .btn-return { background: #dc2626; color: #fff; border: none; padding: 0.6rem 1.5rem; border-radius: 6px; font-weight: 500; text-decoration: none; display: inline-block; margin-top: 1rem; }
    .btn-return:hover { background: #b91c1c; color: #fff; }
  </style>
</head>

  <div class="error-card">
    <div class="error-code"><i class="bi bi-exclamation-octagon me-2"></i>500</div>
    <h3 class="mb-3">Internal System Error</h3>
    <p class="text-secondary">An unexpected exception was safely intercepted. No internal system details or sensitive state were exposed.</p>
    <a href="/" class="btn-return"><i class="bi bi-arrow-clockwise me-1"></i> Return to Safety</a>
  </div>
