<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alert Center — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="alert-center" data-title="Alert Center">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="soc-dashboard.html">SOC</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Alert Center</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Alert Center</h1>
          <p class="text-muted mt-1" id="alertCountSummary">— alerts</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-secondary btn-sm" id="exportBtn"><i class="bi bi-download"></i> Export</button>
        </div>
      </div>

      <section class="xdr-table-wrap" aria-label="Alerts table">
        <div class="table-toolbar">
          <div class="search-input-wrap">
            <i class="bi bi-search"></i>
            <input class="form-control search-input" id="alertSearch" placeholder="Search alerts by title, host, or asset…">
          </div>
          <select class="form-select filter-w-sm" id="filterPriority">
            <option value="">All priorities</option>
            <option value="P1">P1</option><option value="P2">P2</option><option value="P3">P3</option><option value="P4">P4</option>
          </select>
          <select class="form-select filter-w-sm" id="filterSev">
            <option value="">All severities</option>
            <option value="critical">Critical</option><option value="high">High</option>
            <option value="medium">Medium</option><option value="low">Low</option>
          </select>
          <select class="form-select filter-w-md" id="filterStatus">
            <option value="">All statuses</option>
            <option value="open">Open</option><option value="investigating">Investigating</option><option value="closed">Closed</option>
          </select>
          <select class="form-select filter-w-md" id="filterAnalyst">
            <option value="">All analysts</option>
            <option value="unassigned">Unassigned</option>
          </select>
          <button class="btn btn-ghost btn-sm ms-auto" id="clearFilters"><i class="bi bi-x-circle"></i> Clear</button>
        </div>

        <table class="xdr-table" id="alertsTable">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
        <div class="xdr-pagination" id="alertsPagination"></div>
      </section>
    </div>
  </div>
</div>

<!-- Assign modal -->
<div class="xdr-modal-backdrop" data-modal-backdrop="assignModal"></div>
<div class="xdr-modal" id="assignModal">
  <div class="xdr-modal-header"><h3>Assign alert</h3><button data-modal-close class="btn btn-icon btn-ghost"><i class="bi bi-x-lg"></i></button></div>
  <div class="xdr-modal-body">
    <p class="text-muted mb-3">Assigning "<strong id="assignAlertTitle">—</strong>"</p>
    <label class="form-label">Analyst</label>
    <select class="form-select" id="assignAnalystSelect"></select>
  </div>
  <div class="xdr-modal-footer">
    <button class="btn btn-secondary" data-modal-close>Cancel</button>
    <button class="btn btn-primary" id="confirmAssignBtn" data-modal-close>Assign</button>
  </div>
</div>

<!-- Close modal -->
<div class="xdr-modal-backdrop" data-modal-backdrop="closeAlertModal"></div>
<div class="xdr-modal" id="closeAlertModal">
  <div class="xdr-modal-header"><h3>Close alert</h3><button data-modal-close class="btn btn-icon btn-ghost"><i class="bi bi-x-lg"></i></button></div>
  <div class="xdr-modal-body">
    <p class="text-muted mb-3">Closing "<strong id="closeAlertTitle">—</strong>"</p>
    <label class="form-label">Resolution</label>
    <select class="form-select mb-3" id="closeResolutionSelect">
      <option>True Positive — Remediated</option>
      <option>False Positive</option>
      <option>Benign — Authorized Activity</option>
      <option>Duplicate</option>
    </select>
    <label class="form-label">Closing notes</label>
    <textarea class="form-control" id="closeNotes" rows="3" placeholder="Summarize the resolution…"></textarea>
  </div>
  <div class="xdr-modal-footer">
    <button class="btn btn-secondary" data-modal-close>Cancel</button>
    <button class="btn btn-danger" id="confirmCloseBtn" data-modal-close>Close Alert</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/modal-helpers.js"></script>
<script src="../assets/js/core/datatable.js"></script>
<script src="../assets/js/data/alerts-data.js"></script>
<script src="../assets/js/data/analysts-data.js"></script>
<script src="../assets/js/pages/alerts.js"></script>
</body>
</html>
