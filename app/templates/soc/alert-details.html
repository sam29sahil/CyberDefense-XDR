<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alert Details — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="alert-center" data-title="Alert Details">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="soc-dashboard.html">SOC</a><i class="bi bi-chevron-right sep"></i>
        <a href="alerts.html">Alert Center</a><i class="bi bi-chevron-right sep"></i>
        <span class="current" id="breadcrumbAlertId">Alert Details</span>
      </nav>

      <!-- Header -->
      <div class="card mb-4">
        <div class="card-body d-flex flex-wrap justify-content-between align-items-start gap-3">
          <div class="d-flex gap-3">
            <div class="brand-mark brand-mark-lg"><i class="bi bi-exclamation-triangle"></i></div>
            <div>
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <h1 class="fs-detail-title" id="alertTitle">—</h1>
                <span id="alertPriorityPill"></span>
                <span id="alertSevBadge"></span>
                <span id="alertStatusBadge"></span>
              </div>
              <p class="text-muted mb-2" id="alertDesc">—</p>
              <div class="d-flex gap-2 flex-wrap" id="alertMitreRow"></div>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-secondary btn-sm" id="assignBtn"><i class="bi bi-person-plus"></i> Assign</button>
            <button class="btn btn-secondary btn-sm" id="investigateBtn"><i class="bi bi-search"></i> Investigate</button>
            <button class="btn btn-outline-danger btn-sm" id="closeBtn"><i class="bi bi-check-circle"></i> Close</button>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-lg-3 col-6"><div class="card stat-card accent-primary"><div class="eyebrow">Affected Asset</div><div class="stat-value fs-inherit-lg" id="statAsset">—</div></div></div>
        <div class="col-lg-3 col-6"><div class="card stat-card accent-info"><div class="eyebrow">Source</div><div class="stat-value fs-inherit-lg" id="statSource">—</div></div></div>
        <div class="col-lg-3 col-6"><div class="card stat-card accent-warning"><div class="eyebrow">Detection Rule</div><div class="stat-value fs-inherit-lg" id="statRule">—</div></div></div>
        <div class="col-lg-3 col-6"><div class="card stat-card accent-success"><div class="eyebrow">Assigned Analyst</div><div class="stat-value fs-inherit-lg" id="statAnalyst">—</div></div></div>
      </div>

      <div class="row g-4">
        <div class="col-lg-7">
          <section class="card mb-4" aria-labelledby="relatedAlertsTitle">
            <div class="card-header"><h2 id="relatedAlertsTitle">Related Alerts — same host</h2></div>
            <div class="xdr-table-wrap flush">
              <table class="xdr-table">
                <thead><tr><th>Alert</th><th>Severity</th><th>Time</th><th>Status</th></tr></thead>
                <tbody id="relatedAlertsBody"></tbody>
              </table>
            </div>
          </section>

          <section class="card" aria-labelledby="commentsTitle">
            <div class="card-header"><h2 id="commentsTitle">Comments & Activity</h2></div>
            <div class="card-body">
              <div id="commentsList"></div>
              <div class="d-flex gap-2 mt-3">
                <div class="avatar">AR</div>
                <div class="flex-grow-1">
                  <textarea class="form-control mb-2" id="newCommentText" rows="2" placeholder="Add a comment or investigation note…"></textarea>
                  <button class="btn btn-primary btn-sm" id="addCommentBtn"><i class="bi bi-send"></i> Post Comment</button>
                </div>
              </div>
            </div>
          </section>
        </div>

        <div class="col-lg-5">
          <section class="card mb-4" aria-labelledby="timelineTitle">
            <div class="card-header"><h2 id="timelineTitle">Timeline</h2></div>
            <div class="card-body">
              <div class="xdr-timeline" id="alertTimeline"></div>
            </div>
          </section>

          <section class="card" aria-labelledby="evidenceTitle">
            <div class="card-header"><h2 id="evidenceTitle">Evidence</h2></div>
            <div class="card-body" id="evidenceList"></div>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/data/alerts-data.js"></script>
<script src="../assets/js/data/analysts-data.js"></script>
<script src="../assets/js/pages/alert-details.js"></script>
</body>
</html>
