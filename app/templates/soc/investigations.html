<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investigations — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="soc-dashboard" data-title="Investigations">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="soc-dashboard.html">SOC</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Investigations</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Investigation Queue</h1>
          <p class="text-muted mt-1" id="caseCountSummary">— cases</p>
        </div>
        <div class="d-flex gap-2">
          <a href="analyst-workbench.html" class="btn btn-secondary btn-sm"><i class="bi bi-person-workspace"></i> My Workbench</a>
        </div>
      </div>

      <div class="stat-grid-4 mb-4">
        <div class="card stat-card accent-primary"><div class="eyebrow">Open</div><div class="stat-value" id="statOpen">—</div></div>
        <div class="card stat-card accent-warning"><div class="eyebrow">In Progress</div><div class="stat-value" id="statProgress">—</div></div>
        <div class="card stat-card accent-danger"><div class="eyebrow">SLA at Risk</div><div class="stat-value" id="statSlaRisk">—</div></div>
        <div class="card stat-card accent-success"><div class="eyebrow">Closed</div><div class="stat-value" id="statClosed">—</div></div>
      </div>

      <section class="xdr-table-wrap" aria-label="Investigations table">
        <div class="table-toolbar">
          <div class="search-input-wrap">
            <i class="bi bi-search"></i>
            <input class="form-control search-input" id="caseSearch" placeholder="Search cases by title or owner…">
          </div>
          <select class="form-select filter-w-sm" id="filterPriority">
            <option value="">All priorities</option>
            <option value="P1">P1</option><option value="P2">P2</option><option value="P3">P3</option><option value="P4">P4</option>
          </select>
          <select class="form-select filter-w-md" id="filterStatus">
            <option value="">All statuses</option>
            <option value="open">Open</option><option value="in_progress">In Progress</option>
            <option value="pending_review">Pending Review</option><option value="closed">Closed</option>
          </select>
          <select class="form-select filter-w-md" id="filterOwner">
            <option value="">All owners</option>
          </select>
          <button class="btn btn-ghost btn-sm ms-auto" id="clearFilters"><i class="bi bi-x-circle"></i> Clear</button>
        </div>

        <table class="xdr-table" id="casesTable">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
        <div class="xdr-pagination" id="casesPagination"></div>
      </section>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/datatable.js"></script>
<script src="../assets/js/data/cases-data.js"></script>
<script src="../assets/js/pages/investigations.js"></script>
</body>
</html>
