<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Preview — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="reports" data-title="PDF Preview">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="reports-dashboard.html">Reports</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">PDF Preview</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>PDF Preview</h1>
          <p class="text-muted mt-1" id="previewTitle">—</p>
        </div>
        <div class="d-flex gap-2">
          <span class="text-sm text-muted align-self-center" id="pageIndicator">Page 1 of 1</span>
          <button class="btn btn-secondary btn-sm" id="printBtn"><i class="bi bi-printer"></i> Print</button>
          <button class="btn btn-primary btn-sm" id="downloadBtn"><i class="bi bi-download"></i> Download PDF</button>
        </div>
      </div>

      <div class="report-paper" id="previewPaper" style="min-height:600px;"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/data/reports-data.js"></script>
<script src="../assets/js/pages/pdf-preview.js"></script>
</body>
</html>
