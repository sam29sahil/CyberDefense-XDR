<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheduled Reports — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="reports" data-title="Scheduled Reports">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="reports-dashboard.html">Reports</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Scheduled Reports</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Scheduled Reports</h1>
          <p class="text-muted mt-1" id="schedSummary">— schedules configured</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary btn-sm" data-modal-open="addScheduleModal"><i class="bi bi-plus-lg"></i> New Schedule</button>
        </div>
      </div>

      <div class="xdr-table-wrap">
        <table class="xdr-table">
          <thead><tr><th>Report</th><th>Frequency</th><th>Format</th><th>Recipients</th><th>Next Run</th><th>Status</th><th></th></tr></thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add Schedule Modal -->
<div class="xdr-modal-backdrop" data-modal-backdrop="addScheduleModal"></div>
<div class="xdr-modal" id="addScheduleModal">
  <div class="xdr-modal-header"><h3>New scheduled report</h3><button data-modal-close class="btn btn-icon btn-ghost"><i class="bi bi-x-lg"></i></button></div>
  <div class="xdr-modal-body">
    <div class="mb-3"><label class="form-label">Report type</label>
      <select class="form-select" id="newSchedType">
        <option>Executive Summary</option><option>Technical Deep Dive</option>
        <option>Compliance Audit</option><option>Monthly SOC Summary</option>
      </select>
    </div>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Frequency</label>
        <select class="form-select" id="newSchedFreq"><option>Daily</option><option>Weekly</option><option>Bi-weekly</option><option>Monthly</option><option>Quarterly</option></select>
      </div>
      <div class="col-md-6"><label class="form-label">Format</label>
        <select class="form-select" id="newSchedFormat"><option>PDF</option><option>CSV</option><option>JSON</option></select>
      </div>
    </div>
    <div class="mt-3"><label class="form-label">Recipients</label><input class="form-control" id="newSchedRecipients" placeholder="comma-separated emails…"></div>
  </div>
  <div class="xdr-modal-footer">
    <button class="btn btn-secondary" data-modal-close>Cancel</button>
    <button class="btn btn-primary" id="addScheduleConfirm" data-modal-close>Create Schedule</button>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="xdr-modal-backdrop" data-modal-backdrop="deleteScheduleModal"></div>
<div class="xdr-modal" id="deleteScheduleModal">
  <div class="xdr-modal-header"><h3>Delete schedule</h3><button data-modal-close class="btn btn-icon btn-ghost"><i class="bi bi-x-lg"></i></button></div>
  <div class="xdr-modal-body"><p class="mb-0">Delete "<strong id="deleteSchedName">—</strong>"? Future reports on this schedule will no longer be generated.</p></div>
  <div class="xdr-modal-footer">
    <button class="btn btn-secondary" data-modal-close>Cancel</button>
    <button class="btn btn-danger" id="confirmDeleteSchedBtn" data-modal-close>Delete</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/modal-helpers.js"></script>
<script src="../assets/js/data/reports-data.js"></script>
<script src="../assets/js/pages/scheduled-reports.js"></script>
</body>
</html>
