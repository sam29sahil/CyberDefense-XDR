<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Builder — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="reports" data-title="Report Builder">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="reports-dashboard.html">Reports</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Report Builder</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Report Builder</h1>
          <p class="text-muted mt-1">Configure a custom report from live platform data</p>
        </div>
        <div class="d-flex gap-2">
          <a href="reports-dashboard.html" class="btn btn-secondary btn-sm"><i class="bi bi-x-lg"></i> Cancel</a>
          <button class="btn btn-primary btn-sm" id="generateBtn"><i class="bi bi-file-earmark-plus"></i> Generate Report</button>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <section class="card">
            <div class="card-body">
              <div class="builder-section">
                <div class="builder-section-title"><i class="bi bi-card-text"></i> Basics</div>
                <div class="row g-3">
                  <div class="col-md-8">
                    <label class="form-label">Report name</label>
                    <input class="form-control" id="rptName" placeholder="e.g. Q3 SOC Performance Summary">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Format</label>
                    <select class="form-select" id="rptFormat">
                      <option>PDF</option><option>CSV</option><option>JSON</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Report type</label>
                    <select class="form-select" id="rptType">
                      <option>Executive Summary</option><option>Technical Deep Dive</option>
                      <option>Compliance Audit</option><option>Incident Postmortem</option>
                      <option>Monthly SOC Summary</option><option>Vulnerability Assessment</option>
                    </select>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">From</label>
                    <input type="date" class="form-control" id="rptFrom" value="2026-06-24">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">To</label>
                    <input type="date" class="form-control" id="rptTo" value="2026-07-24">
                  </div>
                </div>
              </div>

              <div class="builder-section">
                <div class="builder-section-title"><i class="bi bi-ui-checks"></i> Sections to include</div>
                <div class="section-check-grid" id="sectionsGrid">
                  <label class="action-check"><input type="checkbox" value="Alerts" checked> Alerts</label>
                  <label class="action-check"><input type="checkbox" value="Incidents" checked> Incidents</label>
                  <label class="action-check"><input type="checkbox" value="Vulnerabilities" checked> Vulnerabilities</label>
                  <label class="action-check"><input type="checkbox" value="Detections"> Detection Rules</label>
                  <label class="action-check"><input type="checkbox" value="Assets"> Asset Inventory</label>
                  <label class="action-check"><input type="checkbox" value="ThreatIntel"> Threat Intelligence</label>
                </div>
              </div>

              <div class="builder-section">
                <div class="builder-section-title"><i class="bi bi-people"></i> Recipients (optional)</div>
                <input class="form-control" id="rptRecipients" placeholder="comma-separated emails…">
              </div>
            </div>
          </section>
        </div>

        <div class="col-lg-4">
          <section class="card">
            <div class="card-header"><h2>Preview Summary</h2></div>
            <div class="card-body">
              <div class="info-row"><span class="text-muted">Type</span><span id="prevType">—</span></div>
              <div class="info-row"><span class="text-muted">Format</span><span id="prevFormat">—</span></div>
              <div class="info-row"><span class="text-muted">Date range</span><span id="prevRange">—</span></div>
              <div class="info-row"><span class="text-muted">Sections</span><span id="prevSections">—</span></div>
              <p class="text-muted text-sm mt-3 mb-0">Generation typically completes in under a minute for standard date ranges.</p>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/pages/report-builder.js"></script>
</body>
</html>
