<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="reports" data-title="Reports">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <main class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i><span class="current">Reports</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Reports</h1>
          <p class="text-muted mt-1" id="reportsSummary">— reports generated</p>
        </div>
        <div class="d-flex gap-2">
          <a href="scheduled-reports.html" class="btn btn-secondary btn-sm"><i class="bi bi-calendar2-week"></i> Scheduled Reports</a>
          <a href="report-builder.html" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Generate Report</a>
        </div>
      </div>

      <div class="row g-3 mb-4" id="kpiRow"></div>

      <div class="row g-4 mb-4">
        <div class="col-lg-4">
          <section class="card h-100" aria-labelledby="quickActionsTitle">
            <div class="card-header"><h2 id="quickActionsTitle">Quick Actions</h2></div>
            <div class="card-body d-flex flex-column gap-2">
              <a href="executive-report.html" class="btn btn-secondary text-start"><i class="bi bi-easel me-2"></i> View Executive Summary</a>
              <a href="technical-report.html" class="btn btn-secondary text-start"><i class="bi bi-file-earmark-code me-2"></i> View Technical Report</a>
              <a href="report-builder.html" class="btn btn-secondary text-start"><i class="bi bi-sliders me-2"></i> Build Custom Report</a>
              <a href="scheduled-reports.html" class="btn btn-secondary text-start"><i class="bi bi-clock-history me-2"></i> Manage Schedules</a>
            </div>
          </section>
        </div>
        <div class="col-lg-8">
          <section class="card h-100" aria-labelledby="typeBreakdownTitle">
            <div class="card-header"><h2 id="typeBreakdownTitle">Reports by Type — last 60 days</h2></div>
            <div class="card-body"><div class="chart-box"><canvas id="typeBreakdownChart"></canvas></div></div>
          </section>
        </div>
      </div>

      <section class="xdr-table-wrap" aria-label="Recent reports table">
        <div class="table-toolbar">
          <h2 class="mb-0">Recent Reports</h2>
          <div class="search-input-wrap ms-auto">
            <i class="bi bi-search"></i>
            <input class="form-control search-input" id="reportSearch" placeholder="Search reports…">
          </div>
        </div>
        <table class="xdr-table" id="reportsTable">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
        <div class="xdr-pagination" id="reportsPagination"></div>
      </section>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/core/datatable.js"></script>
<script src="../assets/js/data/reports-data.js"></script>
<script src="../assets/js/pages/reports-dashboard.js"></script>
</body>
</html>
