<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Recommendations — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="ai-assistant" data-title="AI Recommendations">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="ai-dashboard.html">AI Security Assistant</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Recommendations</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1><i class="bi bi-stars"></i> AI Recommendations</h1>
          <p class="text-muted mt-1" id="recSummary">— recommendations</p>
        </div>
        <div class="d-flex gap-2">
          <select class="form-select filter-w-sm" id="filterPriority">
            <option value="">All priorities</option>
            <option value="critical">Critical</option><option value="high">High</option>
            <option value="medium">Medium</option><option value="low">Low</option>
          </select>
          <select class="form-select filter-w-md" id="filterStatus">
            <option value="">All statuses</option>
            <option value="new">New</option><option value="in_progress">In Progress</option>
            <option value="applied">Applied</option><option value="dismissed">Dismissed</option>
          </select>
        </div>
      </div>

      <div id="recommendationsList"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/data/ai-data.js"></script>
<script src="../assets/js/pages/recommendations.js"></script>
</body>
</html>
