<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Risk Analysis — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="ai-assistant" data-title="AI Risk Analysis">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <main class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="ai-dashboard.html">AI Security Assistant</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Risk Analysis</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1><i class="bi bi-stars"></i> AI Risk Analysis</h1>
          <p class="text-muted mt-1">Composite organizational risk score, derived from live signal categories</p>
        </div>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-lg-4">
          <section class="card h-100" aria-labelledby="gaugeTitle">
            <div class="card-header"><h2 id="gaugeTitle">Composite Risk Score</h2></div>
            <div class="card-body">
              <div class="risk-gauge-wrap"><canvas id="riskGaugeChart"></canvas>
                <div class="risk-gauge-score"><div class="num" id="gaugeScore">—</div><div class="lbl" id="gaugeLabel">—</div></div>
              </div>
            </div>
          </section>
        </div>
        <div class="col-lg-8">
          <section class="card h-100" aria-labelledby="trendTitle">
            <div class="card-header"><h2 id="trendTitle">Risk Trend — 14 days</h2></div>
            <div class="card-body"><div class="chart-box"><canvas id="riskTrendChart"></canvas></div></div>
          </section>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-6">
          <section class="card h-100" aria-labelledby="factorsTitle">
            <div class="card-header"><h2 id="factorsTitle">Risk Factor Breakdown</h2></div>
            <div class="card-body" id="riskFactorsList"></div>
          </section>
        </div>
        <div class="col-lg-6">
          <section class="card h-100" aria-labelledby="narrativeTitle">
            <div class="card-header"><h2 id="narrativeTitle"><i class="bi bi-stars text-muted"></i> AI Narrative</h2></div>
            <div class="card-body"><p id="riskNarrative" class="mb-0">—</p></div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/data/ai-data.js"></script>
<script src="../assets/js/pages/risk-analysis.js"></script>
</body>
</html>
