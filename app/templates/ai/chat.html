<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="ai-assistant" data-title="AI Chat">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="ai-dashboard.html">AI Security Assistant</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Chat</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1><i class="bi bi-stars"></i> AI Chat</h1>
          <p class="text-muted mt-1">Ask about alerts, incidents, vulnerabilities, or risk posture</p>
        </div>
        <button class="btn btn-secondary btn-sm" id="newChatBtn"><i class="bi bi-plus-lg"></i> New Chat</button>
      </div>

      <div class="chat-shell">
        <aside class="chat-sidebar" id="chatSidebar"></aside>
        <div class="chat-main">
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-suggestions" id="chatSuggestions"></div>
          <div class="chat-input-row">
            <input class="form-control" id="chatInput" placeholder="Ask the AI assistant…">
            <button class="btn btn-primary" id="chatSendBtn"><i class="bi bi-send"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/data/ai-data.js"></script>
<script src="../assets/js/pages/chat.js"></script>
</body>
</html>
