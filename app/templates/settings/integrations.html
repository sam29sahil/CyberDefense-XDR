<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Integrations — CyberDefense XDR</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >


    <!-- Fonts -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet"
    >


    <!-- CyberDefense XDR CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/main.css') }}"
    >

</head>


<body
    data-page="settings"
    data-title="Integrations"
>


<div class="app-shell">


    <!-- =========================================================
         SIDEBAR
    ========================================================== -->

    <div id="sidebar-root"></div>


    <!-- =========================================================
         MAIN CONTENT
    ========================================================== -->

    <div class="main-content">


        <!-- Navbar -->

        <div id="navbar-root"></div>


        <!-- =====================================================
             PAGE CONTENT
        ====================================================== -->

        <div class="page-wrap fade-in">


            <!-- Breadcrumb -->

            <nav
                class="xdr-breadcrumb"
                aria-label="Breadcrumb"
            >

                <a href="{{ url_for('main.home') }}">
                    Home
                </a>

                <i class="bi bi-chevron-right sep"></i>


                <a href="{{ url_for('settings.index') }}">
                    Settings
                </a>

                <i class="bi bi-chevron-right sep"></i>


                <span class="current">
                    Integrations
                </span>

            </nav>


            <!-- =================================================
                 PAGE HEADER
            ================================================== -->

            <div class="section-title-row">

                <div>

                    <h1>
                        Settings
                    </h1>

                    <p
                        class="text-muted mt-1"
                        id="integrationsSummary"
                    >
                        Loading integrations...
                    </p>

                </div>

            </div>


            <!-- =================================================
                 SETTINGS TABS
            ================================================== -->

            <div class="xdr-tabs tabs-padded mb-4">


                <a
                    href="{{ url_for('settings.general') }}"
                    class="xdr-tab"
                >
                    General
                </a>


                <a
                    href="{{ url_for('settings.security') }}"
                    class="xdr-tab"
                >
                    Security
                </a>


                <a
                    href="{{ url_for('settings.notifications') }}"
                    class="xdr-tab"
                >
                    Notifications
                </a>


                <a
                    href="{{ url_for('settings.api_settings') }}"
                    class="xdr-tab"
                >
                    API Keys
                </a>


                <a
                    href="{{ url_for('settings.integrations') }}"
                    class="xdr-tab active"
                >
                    Integrations
                </a>


                <a
                    href="{{ url_for('settings.profile') }}"
                    class="xdr-tab"
                >
                    My Profile
                </a>


            </div>


            <!-- =================================================
                 INTEGRATIONS GRID
            ================================================== -->

            <div
                class="row g-3"
                id="integrationsGrid"
            >

                <div class="col-12">

                    <div class="card">

                        <div class="card-body text-center py-5">

                            <div
                                class="spinner-border"
                                role="status"
                            >

                                <span class="visually-hidden">
                                    Loading...
                                </span>

                            </div>

                            <p class="text-muted mt-3 mb-0">
                                Loading integrations...
                            </p>

                        </div>

                    </div>

                </div>

            </div>


        </div>

    </div>

</div>



<!-- =============================================================
     CONFIGURE INTEGRATION MODAL
============================================================== -->

<div
    class="xdr-modal-backdrop"
    data-modal-backdrop="configureModal"
></div>


<div
    class="xdr-modal"
    id="configureModal"
>


    <!-- Modal Header -->

    <div class="xdr-modal-header">

        <h3 id="cfgModalTitle">
            Configure integration
        </h3>


        <button
            type="button"
            data-modal-close
            class="btn btn-icon btn-ghost"
            aria-label="Close"
        >

            <i class="bi bi-x-lg"></i>

        </button>

    </div>


    <!-- Modal Body -->

    <div class="xdr-modal-body">


        <!-- Webhook -->

        <div class="mb-3">

            <label
                class="form-label"
                for="cfgWebhook"
            >
                Webhook URL
            </label>


            <input
                type="url"
                class="form-control"
                id="cfgWebhook"
                placeholder="https://hooks.example.com/services/..."
                autocomplete="off"
            >

        </div>


        <!-- API Token -->

        <div class="mb-0">

            <label
                class="form-label"
                for="cfgToken"
            >
                API token
            </label>


            <input
                class="form-control"
                id="cfgToken"
                type="password"
                placeholder="Enter API token"
                autocomplete="new-password"
            >

        </div>


        <div class="form-text mt-2">

            <i class="bi bi-shield-lock me-1"></i>

            The API token is securely hashed before storage.

        </div>

    </div>


    <!-- Modal Footer -->

    <div class="xdr-modal-footer">


        <button
            type="button"
            class="btn btn-secondary"
            data-modal-close
        >
            Cancel
        </button>


        <button
            type="button"
            class="btn btn-primary"
            id="cfgSaveBtn"
        >

            <i class="bi bi-plug me-1"></i>

            Save &amp; Connect

        </button>


    </div>

</div>



<!-- =============================================================
     JAVASCRIPT
============================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>


<script
    src="{{ url_for('static', filename='js/core/shell.js') }}"
></script>


<script
    src="{{ url_for('static', filename='js/core/toast.js') }}"
></script>


<script
    src="{{ url_for('static', filename='js/core/modal-helpers.js') }}"
></script>


<script
    src="{{ url_for('static', filename='js/pages/integrations.js') }}"
></script>


</body>

</html>
