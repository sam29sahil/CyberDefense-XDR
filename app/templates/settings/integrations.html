<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integrations — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="settings" data-title="Integrations">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="general-settings.html">Settings</a><i class="bi bi-chevron-right sep"></i><span class="current">Integrations</span>
      </nav>

      <div class="section-title-row">
        <div><h1>Settings</h1><p class="text-muted mt-1" id="integrationsSummary">— integrations connected</p></div>
      </div>

      <div class="xdr-tabs tabs-padded mb-4">
        <a href="general-settings.html" class="xdr-tab">General</a>
        <a href="security-settings.html" class="xdr-tab">Security</a>
        <a href="notification-settings.html" class="xdr-tab">Notifications</a>
        <a href="api-settings.html" class="xdr-tab">API Keys</a>
        <a href="integrations.html" class="xdr-tab active">Integrations</a>
        <a href="profile.html" class="xdr-tab">My Profile</a>
      </div>

      <div class="row g-3" id="integrationsGrid"></div>
    </div>
  </div>
</div>

<!-- Configure modal -->
<div class="xdr-modal-backdrop" data-modal-backdrop="configureModal"></div>
<div class="xdr-modal" id="configureModal">
  <div class="xdr-modal-header"><h3 id="cfgModalTitle">Configure integration</h3><button data-modal-close class="btn btn-icon btn-ghost"><i class="bi bi-x-lg"></i></button></div>
  <div class="xdr-modal-body">
    <div class="mb-3"><label class="form-label">Webhook URL</label><input class="form-control" id="cfgWebhook" placeholder="https://hooks.example.com/services/…"></div>
    <div class="mb-0"><label class="form-label">API token</label><input class="form-control" type="password" id="cfgToken" placeholder="••••••••••••••••"></div>
  </div>
  <div class="xdr-modal-footer">
    <button class="btn btn-secondary" data-modal-close>Cancel</button>
    <button class="btn btn-primary" id="cfgSaveBtn" data-modal-close>Save &amp; Connect</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/modal-helpers.js"></script>
<script src="../assets/js/data/settings-data.js"></script>
<script src="../assets/js/pages/integrations.js"></script>
</body>
</html>
