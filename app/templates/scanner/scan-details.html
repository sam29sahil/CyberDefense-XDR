<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Details — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="scan-history" data-title="Scan Details">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="scanner-dashboard.html">Vulnerability Scanner</a><i class="bi bi-chevron-right sep"></i>
        <a href="scan-history.html">Scan History</a><i class="bi bi-chevron-right sep"></i>
        <span class="current" id="breadcrumbScanId">Scan Details</span>
      </nav>

      <!-- Header -->
      <div class="card mb-4">
        <div class="card-body d-flex flex-wrap justify-content-between align-items-start gap-3">
          <div class="d-flex gap-3">
            <div class="brand-mark brand-mark-lg"><i class="bi bi-search"></i></div>
            <div>
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <h1 class="fs-detail-title" id="scanName">—</h1>
                <span id="scanStatusPill"></span>
              </div>
              <p class="text-muted mb-0" id="scanMeta">—</p>
            </div>
          </div>
          <div class="d-flex gap-3 align-items-center">
            <div class="risk-gauge" id="riskGauge"><span class="risk-gauge-value" id="riskGaugeValue">0</span></div>
            <button class="btn btn-secondary btn-sm" id="exportReportBtn"><i class="bi bi-download"></i> Export Report</button>
          </div>
        </div>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-lg-5">
          <section class="card h-100" aria-labelledby="scanSevTitle">
            <div class="card-header"><h2 id="scanSevTitle">Findings by Severity</h2></div>
            <div class="card-body"><div class="chart-box-sm"><canvas id="scanSeverityChart"></canvas></div></div>
          </section>
        </div>
        <div class="col-lg-7">
          <section class="card h-100" aria-labelledby="targetsTitle">
            <div class="card-header"><h2 id="targetsTitle">Scanned Targets</h2></div>
            <div class="card-body" id="scanTargetsList"></div>
          </section>
        </div>
      </div>

      <section class="xdr-table-wrap" aria-label="Scan findings">
        <div class="table-toolbar">
          <h2 class="mb-0">Findings</h2>
          <select class="form-select filter-w-sm ms-auto" id="filterSev">
            <option value="">All severities</option>
            <option value="critical">Critical</option><option value="high">High</option>
            <option value="medium">Medium</option><option value="low">Low</option>
          </select>
        </div>
        <table class="xdr-table" id="findingsTable">
          <thead><tr><th>Vulnerability</th><th>Host</th><th>CVSS</th><th>Port/Service</th><th>Status</th><th></th></tr></thead>
          <tbody id="findingsBody"></tbody>
        </table>
      </section>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/data/scan-data.js"></script>
<script src="../assets/js/pages/scan-details.js"></script>
</body>
</html>
