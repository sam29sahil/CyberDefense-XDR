<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan History — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="scan-history" data-title="Scan History">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="scanner-dashboard.html">Vulnerability Scanner</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Scan History</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Scan History</h1>
          <p class="text-muted mt-1" id="scanCountSummary">— scans</p>
        </div>
        <div class="d-flex gap-2">
          <a href="new-scan.html" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> New Scan</a>
        </div>
      </div>

      <section class="xdr-table-wrap" aria-label="Scan history table">
        <div class="table-toolbar">
          <div class="search-input-wrap">
            <i class="bi bi-search"></i>
            <input class="form-control search-input" id="scanSearch" placeholder="Search scans by name or target…">
          </div>
          <select class="form-select filter-w-md" id="filterStatus">
            <option value="">All statuses</option>
            <option value="completed">Completed</option><option value="running">Running</option><option value="queued">Queued</option>
          </select>
          <select class="form-select filter-w-md" id="filterType">
            <option value="">All types</option>
            <option>Full Scan</option><option>Quick Scan</option><option>Compliance Scan</option><option>Custom Scan</option>
          </select>
          <button class="btn btn-ghost btn-sm ms-auto" id="clearFilters"><i class="bi bi-x-circle"></i> Clear</button>
        </div>

        <table class="xdr-table" id="scansTable">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
        <div class="xdr-pagination" id="scansPagination"></div>
      </section>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/datatable.js"></script>
<script src="../assets/js/data/scan-data.js"></script>
<script src="../assets/js/pages/scan-history.js"></script>
</body>
</html>
