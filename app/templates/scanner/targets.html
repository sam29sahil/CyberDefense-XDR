<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Targets — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
</head>
<body data-page="vuln-scanner" data-title="Scan Targets">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="{{ url_for('dashboard.index') }}">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="{{ url_for('scanner.index') }}">Vulnerability Scanner</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Targets</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Scan Targets</h1>
          <p class="text-muted mt-1" id="targetCountSummary">— targets</p>
        </div>
        <div class="d-flex gap-2">
          <div class="search-input-wrap" style="max-width:260px;">
            <i class="bi bi-search"></i>
            <input class="form-control search-input" id="targetSearch" placeholder="Search targets…">
          </div>
          <button class="btn btn-primary btn-sm" data-modal-open="addTargetModal"><i class="bi bi-plus-lg"></i> Add Target</button>
        </div>
      </div>

      <div class="row g-3" id="targetsGrid"></div>
    </div>
  </div>
</div>

<!-- Add Target Modal -->
<div class="xdr-modal-backdrop" data-modal-backdrop="addTargetModal"></div>
<div class="xdr-modal" id="addTargetModal">
  <div class="xdr-modal-header"><h3>Add scan target</h3><button data-modal-close class="btn btn-icon btn-ghost"><i class="bi bi-x-lg"></i></button></div>
  <div class="xdr-modal-body">
    <div class="mb-3">
      <label class="form-label">Target name</label>
      <input class="form-control" id="newTargetName" placeholder="e.g. Local Lab or Staging API">
    </div>
    <div class="mb-3">
      <label class="form-label">Target IP / CIDR / Domain / URL</label>
      <input class="form-control" id="newTargetInput" placeholder="e.g. 127.0.0.1, scanme.nmap.org, or http://127.0.0.1:5000">
      <small class="text-muted">Supports IPv4, IPv6, Domain, Hostname, CIDR (/24 max), or HTTP/HTTPS URL</small>
    </div>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Type</label>
        <select class="form-select" id="newTargetType">
          <option value="Host">Host (IPv4/IPv6)</option>
          <option value="Domain">Domain / Hostname</option>
          <option value="URL">Web URL</option>
          <option value="Subnet">Subnet (CIDR)</option>
          <option value="Asset Group">Asset Group</option>
          <option value="Cloud Account">Cloud Account</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Owner</label>
        <input class="form-control" id="newTargetOwner" placeholder="e.g. Platform Team">
      </div>
    </div>
    <div class="form-check mt-3">
      <input class="form-check-input" type="checkbox" id="newTargetAuthorized" checked>
      <label class="form-check-label text-sm text-muted" for="newTargetAuthorized">
        Target is owned or explicitly authorized for vulnerability assessments
      </label>
    </div>
  </div>
  <div class="xdr-modal-footer">
    <button class="btn btn-secondary" data-modal-close>Cancel</button>
    <button class="btn btn-primary" id="addTargetConfirm">Add Target</button>
  </div>
</div>

<script>window.XDR_ACTIVE = "vuln-scanner";</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/shell.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/toast.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/modal-helpers.js') }}"></script>
<script src="{{ url_for('static', filename='js/data/target-data.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/targets.js') }}"></script>
</body>
</html>
