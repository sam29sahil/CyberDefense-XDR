<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incident Timeline — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="{{ url_for("static", filename="css/main.css") }}" rel="stylesheet">
</head>
<body data-page="incident-response" data-title="Incident Timeline">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="incident-dashboard.html">Incident Response</a><i class="bi bi-chevron-right sep"></i>
        <a href="incident-details.html" id="breadcrumbIncLink">Incident</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Timeline</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Incident Timeline</h1>
          <p class="text-muted mt-1" id="timelineSummary">— events</p>
        </div>
        <div class="d-flex gap-2">
          <select class="form-select filter-w-md" id="filterType">
            <option value="">All event types</option>
            <option value="created">Created</option>
            <option value="assigned">Assigned</option>
            <option value="status_change">Status change</option>
            <option value="evidence_added">Evidence added</option>
            <option value="comment">Comment</option>
            <option value="escalated">Escalated</option>
            <option value="resolved">Resolved</option>
          </select>
        </div>
      </div>

      <section class="card">
        <div class="card-body">
          <div class="xdr-timeline" id="fullTimeline"></div>
        </div>
      </section>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for("static", filename="js/app.js") }}"></script>
<script src="{{ url_for("static", filename="js/core/shell.js") }}"></script>
<script src="{{ url_for("static", filename="js/core/toast.js") }}"></script>
<script src="{{ url_for("static", filename="js/data/incident-data.js") }}"></script>
<script src="{{ url_for("static", filename="js/data/timeline-data.js") }}"></script>
<script src="{{ url_for("static", filename="js/pages/timeline.js") }}"></script>
</body>
</html>
