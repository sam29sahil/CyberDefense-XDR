<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incident Dashboard — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="{{ url_for("static", filename="css/main.css") }}" rel="stylesheet">
</head>
<body data-page="incident-response" data-title="Incident Dashboard">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <main class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i><span class="current">Incident Dashboard</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Incident Response</h1>
          <p class="text-muted mt-1">20 tracked incidents across ransomware, breach, phishing, and cloud categories</p>
        </div>
        <div class="d-flex gap-2">
          <a href="playbooks.html" class="btn btn-secondary btn-sm"><i class="bi bi-journal-check"></i> Playbooks</a>
          <a href="incident-list.html" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> New Incident</a>
        </div>
      </div>

      <div class="row g-3 mb-4" id="kpiRow"></div>

      <div class="row g-4 mb-4">
        <div class="col-lg-7">
          <section class="card h-100" aria-labelledby="trendTitle">
            <div class="card-header"><h2 id="trendTitle">Incident Trend — last 14 days</h2></div>
            <div class="card-body"><div class="chart-box"><canvas id="incidentTrendChart"></canvas></div></div>
          </section>
        </div>
        <div class="col-lg-5">
          <section class="card h-100" aria-labelledby="prioDistTitle">
            <div class="card-header"><h2 id="prioDistTitle">Priority Distribution</h2></div>
            <div class="card-body"><div class="chart-box-sm"><canvas id="priorityChart"></canvas></div></div>
          </section>
        </div>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-lg-5">
          <section class="card h-100" aria-labelledby="resTimeTitle">
            <div class="card-header"><h2 id="resTimeTitle">Resolution Time by Category (hrs)</h2></div>
            <div class="card-body"><div class="chart-box-sm"><canvas id="resolutionChart"></canvas></div></div>
          </section>
        </div>
        <div class="col-lg-7">
          <section class="card h-100" aria-labelledby="recentTitle">
            <div class="card-header">
              <h2 id="recentTitle">Recent Incidents</h2>
              <a href="incident-list.html" class="text-sm">View all <i class="bi bi-arrow-right"></i></a>
            </div>
            <div class="xdr-table-wrap flush">
              <table class="xdr-table">
                <thead><tr><th>Incident</th><th>Severity</th><th>Status</th><th>Assigned</th></tr></thead>
                <tbody id="recentIncidentsBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="{{ url_for("static", filename="js/app.js") }}"></script>
<script src="{{ url_for("static", filename="js/core/shell.js") }}"></script>
<script src="{{ url_for("static", filename="js/core/toast.js") }}"></script>
<script src="{{ url_for("static", filename="js/core/charts.js") }}"></script>
<script src="{{ url_for("static", filename="js/data/incident-data.js") }}"></script>
<script src="{{ url_for("static", filename="js/data/timeline-data.js") }}"></script>
<script src="{{ url_for("static", filename="js/pages/incident-dashboard.js") }}"></script>
</body>
</html>
