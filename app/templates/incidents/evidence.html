<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evidence — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="incident-response" data-title="Evidence">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="incident-dashboard.html">Incident Response</a><i class="bi bi-chevron-right sep"></i>
        <a href="incident-details.html" id="breadcrumbIncLink">Incident</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Evidence</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Evidence Locker</h1>
          <p class="text-muted mt-1" id="evidenceSummary">— items collected</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-secondary btn-sm" id="uploadBtn"><i class="bi bi-upload"></i> Upload Evidence</button>
        </div>
      </div>

      <div class="stat-grid-4 mb-4">
        <div class="card stat-card accent-primary"><div class="eyebrow">Log Bundles</div><div class="stat-value" id="statLogs">—</div></div>
        <div class="card stat-card accent-info"><div class="eyebrow">Network Captures</div><div class="stat-value" id="statPcap">—</div></div>
        <div class="card stat-card accent-warning"><div class="eyebrow">Memory Dumps</div><div class="stat-value" id="statMem">—</div></div>
        <div class="card stat-card accent-success"><div class="eyebrow">Screenshots &amp; Samples</div><div class="stat-value" id="statOther">—</div></div>
      </div>

      <section class="card" aria-label="Evidence items">
        <div class="card-body">
          <div id="evidenceGrid"></div>
        </div>
      </section>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/data/incident-data.js"></script>
<script src="../assets/js/pages/evidence.js"></script>
</body>
</html>
