<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incidents — CyberDefense XDR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body data-page="incident-response" data-title="Incidents">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="navbar-root"></div>

    <div class="page-wrap fade-in">
      <nav class="xdr-breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a><i class="bi bi-chevron-right sep"></i>
        <a href="incident-dashboard.html">Incident Response</a><i class="bi bi-chevron-right sep"></i>
        <span class="current">Incidents</span>
      </nav>

      <div class="section-title-row">
        <div>
          <h1>Incidents</h1>
          <p class="text-muted mt-1" id="incidentCountSummary">— incidents</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary btn-sm" data-modal-open="createIncidentModal"><i class="bi bi-plus-lg"></i> New Incident</button>
        </div>
      </div>

      <section class="xdr-table-wrap" aria-label="Incidents table">
        <div class="table-toolbar">
          <div class="search-input-wrap">
            <i class="bi bi-search"></i>
            <input class="form-control search-input" id="incidentSearch" placeholder="Search by title, category, or asset…">
          </div>
          <select class="form-select filter-w-sm" id="filterSev">
            <option value="">All severities</option>
            <option value="critical">Critical</option><option value="high">High</option>
            <option value="medium">Medium</option><option value="low">Low</option>
          </select>
          <select class="form-select filter-w-md" id="filterStatus">
            <option value="">All statuses</option>
            <option value="open">Open</option><option value="in_progress">In Progress</option>
            <option value="resolved">Resolved</option><option value="closed">Closed</option>
          </select>
          <select class="form-select filter-w-md" id="filterCategory">
            <option value="">All categories</option>
          </select>
          <button class="btn btn-ghost btn-sm ms-auto" id="clearFilters"><i class="bi bi-x-circle"></i> Clear</button>
        </div>

        <table class="xdr-table" id="incidentsTable">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
        <div class="xdr-pagination" id="incidentsPagination"></div>
      </section>
    </div>
  </div>
</div>

<!-- Create Incident Modal -->
<div class="xdr-modal-backdrop" data-modal-backdrop="createIncidentModal"></div>
<div class="xdr-modal" id="createIncidentModal">
  <div class="xdr-modal-header"><h3>New incident</h3><button data-modal-close class="btn btn-icon btn-ghost"><i class="bi bi-x-lg"></i></button></div>
  <div class="xdr-modal-body">
    <div class="mb-3"><label class="form-label">Title</label><input class="form-control" id="newIncTitle" placeholder="e.g. Suspicious data transfer from finance segment"></div>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label">Severity</label>
        <select class="form-select" id="newIncSeverity">
          <option value="critical">Critical</option><option value="high" selected>High</option>
          <option value="medium">Medium</option><option value="low">Low</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Category</label>
        <select class="form-select" id="newIncCategory"></select>
      </div>
    </div>
    <div class="mb-0"><label class="form-label">Description</label><textarea class="form-control" id="newIncDesc" rows="3" placeholder="What happened?"></textarea></div>
  </div>
  <div class="xdr-modal-footer">
    <button class="btn btn-secondary" data-modal-close>Cancel</button>
    <button class="btn btn-primary" id="createIncidentConfirm" data-modal-close>Create Incident</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/modal-helpers.js"></script>
<script src="../assets/js/core/datatable.js"></script>
<script src="../assets/js/data/incident-data.js"></script>
<script src="../assets/js/pages/incident-list.js"></script>
</body>
</html>
